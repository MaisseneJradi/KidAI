# Intégration continue : lint et tests à chaque push et à chaque Pull Request.
# Aucun service externe : le backend teste sur SQLite en mémoire, le frontend sur l'API simulée
# (MSW), les tests data / RAG n'utilisent ni Ollama ni modèle d'embeddings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, black, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: pytest -q

  frontend:
    name: Frontend (eslint, prettier, build, Vitest, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  data:
    name: Données et RAG (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            data/requirements.txt
            rag/requirements.txt
      # Sans sentence-transformers (et donc sans PyTorch) : les tests n'en ont pas besoin.
      - run: pip install -r data/requirements.txt qdrant-client==1.12.1 ruff==0.8.6
      - run: ruff check data rag --extend-exclude data/raw
      - run: python -m pytest -q data/tests rag/tests
